aid: terralayr
name: terralayr
description: >-
  terralayr is a German energy-flexibility company that develops, owns and operates
  utility-scale battery energy storage systems (BESS) and runs LAYR, a cloud platform
  that aggregates heterogeneous storage assets and makes their flexibility available
  as bookable capacity to utilities, grid operators, power traders, aggregators and
  asset owners. The platform lets customers buy and sell dispatchable capacity to
  balance renewable generation against fluctuating grid demand, with storage bookable
  via API and no complex hardware onboarding. terralayr is backed by Creandum and
  Earlybird. Its LAYR product API is B2B/private and publishes no public OpenAPI,
  SDKs or developer documentation; this profile captures the public well-known
  discovery, security and operational surface.
